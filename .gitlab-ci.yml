# remove image older than 48h from runner
deprecated_image:
  stage: runner_cleanup
  tags:
    - dodo-group-runner
  script:
    - docker image prune -a --filter "until=48h" -f
    #   - sudo docker rmi -f $(sudo docker images "registry.gitlab.com/dodo1604703/dodobe/feat/refactor:*" -q | grep -v $(sudo docker images "registry.gitlab.com/dodo1604703/dodobe/feat/refactor:latest" -q))
    - docker images registry.gitlab.com/dodo1604703/dodobe/feat/refactor --format '{{.ID}} {{.Tag}}' | grep -v ' latest$' | awk '{print $1}' | xargs -r docker rmi -f || true
    - echo "Updated list of image in RUNNER instance"
    - docker images

# stop the runner after deployment
stop_ec2:
  stage: runner_down
  image: python:3.9
  script:
    - pip install boto3
    - python stop_ec2.py
