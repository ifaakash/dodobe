stages:
  - runner_up
  - build_cum_deploy
  - deploy_dev
  - runner_cleanup
  - runner_down

variables:
  AWS_DEFAULT_REGION: "ap-south-1" # mumbai region for AWS
  IMAGE_NAME: "registry.gitlab.com/dodo1604703/dodobe/feat/refactor"
  IMAGE_TAG: "publish"

# cache node modules for faster builds
cache:
  paths:
    - node_modules/

# start the runner for image building foundation
start_ec2:
  stage: runner_up
  image: python:3.9
  script:
    - pip install boto3
    - python -c "import boto3; boto3.client('sts').get_caller_identity()"
    - python start_ec2.py

# Build the image for the application and push to dockerhub
build-application:
  stage: build_cum_deploy
  tags:
    - dodo-group-runner
  image: bitnami/git:latest
  before_script:
    - unset DOCKER_HOST
    - docker login $GITLAB_REGISTRY -u $GITLAB_USERNAME -p $REGISTRY_PASSWORD
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    # - sudo docker tag $IMAGE_NAME:latest $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    # - sudo docker tag $IMAGE_NAME:latest $IMAGE_NAME:$(date +%Y%m%d-%H%M%S)
    - docker images
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - aws autoscaling start-instance-refresh --auto-scaling-group-name dodo-backend-backup-asg
    # - sudo docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA

