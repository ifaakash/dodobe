stages:
  - runner_up
  - build
  - deploy_dev
  - cleanup
  - runner_down

variables:
  AWS_DEFAULT_REGION: "ap-south-1" # mumbai region for AWS
  IMAGE_NAME: "registry.gitlab.com/dodo1604703/dodobe/feat/refactor"

# cache node modules for faster builds
cache:
  paths:
    - node_modules/

# start the runner for image building foundation
.start_ec2:
  stage: runner_up
  image: python:3.9
  script:
    - pip install boto3
    - python -c "import boto3; boto3.client('sts').get_caller_identity()"
    - python start_ec2.py

# Build the image for the application and push to dockerhub
build-application:
  stage: build
  tags:
    - dodo-group-runner
  image: bitnami/git:latest
  before_script:
    - unset DOCKER_HOST
    - docker login $GITLAB_REGISTRY -u $GITLAB_USERNAME -p $REGISTRY_PASSWORD
  script:
    - git branch && git checkout feat/refactor
    - git pull
    - git checkout feat/refactor
    - docker build -t $IMAGE_NAME .
    # - docker tag $IMAGE_NAME:latest $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    # - docker tag $IMAGE_NAME:latest $IMAGE_NAME:$(date +%Y%m%d-%H%M%S)
    - docker images
    - docker push registry.gitlab.com/dodo1604703/dodobe/feat/refactor:latest
    # - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA

# stop existing containers with {latest-1} code structure
stop_existing_infra:
  stage: deploy_dev
  tags:
    - dodo-group-runner
  # allow job to fail as there might be case that there is no container running, so we proceed with deployment
  allow_failure: true
  script:
    - apt-get update && apt-get install -y libkrb5-3 openssh-client
    - echo "$SSH_PRIVATE_KEY" > dodokey.pem
    - chmod 600 dodokey.pem
    - ssh -o StrictHostKeyChecking=no -i dodokey.pem ubuntu@ec2-13-202-63-227.ap-south-1.compute.amazonaws.com "sudo docker ps && sudo docker rm -f \$(sudo docker stop \$(sudo docker ps -a -q))"
  artifacts:
    paths:
      - dodokey.pem
    expire_in: 1 day

# spin up the latest code structure application
start_new_infra:
  stage: deploy_dev
  tags:
    - dodo-group-runner
  script:
    - apt update && apt install -y sudo openssh-client
    - sudo whoami # Testing
    - echo "$SSH_PRIVATE_KEY" > dodokey.pem
    - ssh -o StrictHostKeyChecking=no -i dodokey.pem ubuntu@ec2-13-202-63-227.ap-south-1.compute.amazonaws.com "sudo docker images -q | grep . && sudo docker rmi -f \$(sudo docker images -aq) || echo 'No images to remove'; sudo docker pull registry.gitlab.com/dodo1604703/dodobe/feat/refactor:latest && sudo docker images && sudo docker run -d -p 3001:3002 -e AWS_REGION=$AWS_REGION -e S3_BUCKET_NAME=$S3_BUCKET_NAME -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_S3 -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_S3 --restart=always registry.gitlab.com/dodo1604703/dodobe/feat/refactor:latest"

# remove image older than 48h from runner
deprecated_image:
  stage: cleanup
  tags:
    - dodo-group-runner
  script:
    - docker image prune -a --filter "until=48h" -f
    #   - docker rmi -f $(docker images "registry.gitlab.com/dodo1604703/dodobe/feat/refactor:*" -q | grep -v $(docker images "registry.gitlab.com/dodo1604703/dodobe/feat/refactor:latest" -q))
    - docker images registry.gitlab.com/dodo1604703/dodobe/feat/refactor --format '{{.ID}} {{.Tag}}' | grep -v ' latest$' | awk '{print $1}' | xargs -r docker rmi -f || true
    - echo "Updated list of image in RUNNER instance"
    - docker images
